name: Calculator CI

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm install

    - name: Run unit tests
      run: npm test

    - name: Lint code
      run: npm run lint

    # ----------------------------------------------------
    # SCA – OWASP Dependency Check (JavaScript)
    # ----------------------------------------------------
    - name: Dependency audit
      run: npm audit --audit-level=high

    # ----------------------------------------------------
    # SAST – CodeQL
    # ----------------------------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: CodeQL Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # ----------------------------------------------------
    # Docker Build
    # ----------------------------------------------------
    - name: Build Docker image
      run: docker build -t calculator-api:${{ github.sha }} .

    # ----------------------------------------------------
    #  Trivy – Container Image Security Scan
    # ----------------------------------------------------
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: image
        image-ref: calculator-api:${{ github.sha }}
        vuln-type: os,library
        severity: CRITICAL
        ignore-unfixed: true
        format: sarif
        output: trivy-results.sarif


    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif



      # ----------------------------------------------------
    #  Docker Runtime Smoke Test (Node.js)
    # ----------------------------------------------------
    - name: Run container and test
      run: |
        docker run -d -p 3000:3000 --name test-app calculator-api:${{ github.sha }}
        sleep 5
        curl -f http://localhost:3000/health || exit 1
        curl -f -X POST -H 'content-type: application/json' -d '{"a":2,"b":3}' http://localhost:3000/add
        test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"a":"bad","b":3}' http://localhost:3000/add)" = "400"
        docker logs test-app
        docker stop test-app
        docker rm test-app
