name: Calculator CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to deploy"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_NAME }}



      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to Kubernetes
        run: |
          sed "s#image: calculator-api:dev#image: ${{ secrets.IMAGE_REPOSITORY }}:${{ inputs.image_tag }}#" k8/deployment.yml | kubectl apply -f -

      - name: Verify Rollout
        run: kubectl rollout status deployment.apps/calculator-api --timeout=120s

      - name: Rollback command
        run: echo 'kubectl rollout undo deployment/calculator-api'
